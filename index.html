<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile Layout</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: #ff2faf;
            font-family: sans-serif;
        }
        .container {
            width: 90%;
            max-width: 400px;
            text-align: center;
        }
        .image-area {
            width: 100%;
            height: auto;
            background-color: #ccc;
            border-radius: 10px;
            margin-bottom: 20px;
            overflow: hidden;
        }
        .image-area img {
            width: 100%;
            display: block;
        }
        .text-area {
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="image-area">
            <img src="" alt="Placeholder Image">
        </div>

        <div class="text-area">
            <p>hoy mga diwata TARA EMEL</p>
        </div>
    </div>

</body>
</html>
